name: build-image

# One guest, one disk. The same ext4 image boots into a serial shell or, with
# browserlinux.desktop on the kernel cmdline, into X. It is split into 128KB
# zstd chunks because that is what static hosting can serve piecewise and what
# v86's use_parts loader expects.
#
# The earlier initrd path is gone: with Debian's merged-usr layout the initramfs
# root has /bin, /sbin and /lib as symlinks, and exec of /init failed with ENOENT
# even when pointing init= straight at /usr/bin/dash. The same files exec fine
# from a disk, so the disk is the only boot path until that is understood.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-image.yml"
      - "image/**"
      # The site is assembled from public/, so a frontend change has to redeploy
      # too — otherwise the fix lives in git and nowhere a user can see.
      - "public/**"

permissions:
  contents: write

env:
  SUITE: bookworm
  MIRROR: http://deb.debian.org/debian
  PACKAGES: >-
    sysvinit-core sysvinit-utils netbase iproute2 procps less vim-tiny
    xinit xserver-xorg xserver-xorg-video-fbdev xserver-xorg-input-evdev
    x11-xserver-utils xterm openbox lxpanel pcmanfm
    yaru-theme-gtk yaru-theme-icon fonts-dejavu-core fontconfig

jobs:
  kernel:
    uses: ./.github/workflows/build-kernel.yml

  guest:
    needs: kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap zstd

      - name: Fetch custom kernel
        uses: actions/download-artifact@v4
        with:
          name: kernel-i386
          path: kernel-out

      - name: Bootstrap rootfs
        run: |
          sudo debootstrap --arch=i386 --variant=minbase \
            --exclude=systemd,systemd-sysv \
            "$SUITE" rootfs "$MIRROR"
          sudo mount --rbind /dev rootfs/dev
          sudo mount -t proc proc rootfs/proc
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf
          sudo chroot rootfs apt-get update
          sudo chroot rootfs env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends $PACKAGES
          sudo umount -R rootfs/dev rootfs/proc

      - name: Configure the guest
        run: |
          sudo cp image/inittab rootfs/etc/inittab
          sudo cp image/fstab rootfs/etc/fstab
          sudo cp image/xsession rootfs/root/.xinitrc
          sudo cp image/profile rootfs/root/.profile
          sudo cp image/xorg.conf rootfs/etc/X11/xorg.conf
          sudo chmod 755 rootfs/root/.xinitrc
          echo browser-linux | sudo tee rootfs/etc/hostname
          sudo sed -i 's|^root:[^:]*|root:|' rootfs/etc/shadow
          sudo rm -rf rootfs/var/lib/apt/lists rootfs/var/cache/apt/archives \
                      rootfs/usr/share/man rootfs/usr/share/locale rootfs/lib/modules
          sudo du -sh rootfs

      - name: Write the disk image
        run: |
          truncate -s 2G debian-guest.img
          sudo mkfs.ext4 -q -L browserlinux -d rootfs debian-guest.img
          sudo tune2fs -O ^has_journal debian-guest.img

      - name: Split into static-hosting chunks
        run: |
          curl -fsSL -o split-image.py https://raw.githubusercontent.com/copy/v86/master/tools/split-image.py
          mkdir -p guest-chunks
          python3 split-image.py --zstd 128k debian-guest.img guest-chunks/chunk-%d-%d
          ls guest-chunks | wc -l
          du -sh guest-chunks

      - name: Stage kernel
        run: cp kernel-out/bzImage debian-bzImage

      - uses: actions/upload-artifact@v4
        with:
          name: guest-i386
          path: |
            debian-bzImage
            guest-chunks

  # The guests are assembled into the site here rather than committed to git:
  # Pages serves them same-origin, and the repo stays free of binaries.
  site:
    needs: guest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Build the site payload
        run: npm run setup

      - name: Collect guest images
        uses: actions/download-artifact@v4
        with:
          name: guest-i386
          path: public/images

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4

      # Pages propagation lags, so retry. Checks the paths the page actually
      # references rather than a hand-written list, because root-absolute URLs
      # 404 on a project Pages site and look identical to a broken boot.
      - name: Smoke check the deployed site
        run: |
          base="https://wangyvqian.github.io/browser-linux"
          refs=$(curl -s --max-time 30 "$base/" | grep -oE '(href|src)="[^"]+"' | sed -E 's/.*="([^"]+)"/\1/' | grep -v '^http' | sort -u)
          paths="$refs images/guest-chunks/chunk-0-131072.zst probe.html"
          echo "checking: $paths"
          for attempt in 1 2 3 4 5 6; do
            missing=""
            for path in $paths; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$base/$path" || echo 000)
              case "$code" in 200|206) ;; *) missing="$missing $path($code)" ;; esac
            done
            if [ -z "$missing" ]; then echo "all referenced assets live"; exit 0; fi
            echo "attempt $attempt missing:$missing"; sleep 20
          done
          echo "still missing after retries:$missing"
          exit 1

name: build-image

# Builds the guest: a Debian i386 rootfs packed as an initrd, paired with the
# built-in-driver kernel from build-kernel. v86 has no long mode, so every
# artifact here is 32-bit.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-image.yml"
      - "image/**"

permissions:
  contents: write

jobs:
  kernel:
    uses: ./.github/workflows/build-kernel.yml

  debian-i386:
    needs: kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap cpio

      - name: Fetch custom kernel
        uses: actions/download-artifact@v4
        with:
          name: kernel-i386
          path: kernel-out

      - name: Bootstrap Debian i386 rootfs
        run: |
          sudo debootstrap --arch=i386 --variant=minbase \
            --include=sysvinit-core,sysvinit-utils,netbase,iproute2,procps,less,vim-tiny \
            --exclude=systemd,systemd-sysv \
            bookworm rootfs http://deb.debian.org/debian

      - name: Install the desktop stack
        run: |
          set -euo pipefail
          sudo mount --rbind /dev rootfs/dev
          sudo mount -t proc proc rootfs/proc
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf
          sudo chroot rootfs /bin/sh -c '
            apt-get update &&
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
              xserver-xorg xserver-xorg-video-fbdev xserver-xorg-input-evdev
              x11-xserver-utils xterm openbox lxpanel pcmanfm
              yaru-theme-gtk yaru-theme-icon fonts-dejavu-core fontconfig
          '
          sudo umount -R rootfs/proc rootfs/dev 2>/dev/null || true

      - name: Configure serial console and init
        run: |
          sudo cp image/inittab rootfs/etc/inittab
          sudo cp image/fstab rootfs/etc/fstab
          sudo cp image/init rootfs/init
          sudo cp image/xsession rootfs/root/.xinitrc
          sudo cp image/xorg.conf rootfs/etc/X11/xorg.conf
          sudo chmod 755 rootfs/init rootfs/root/.xinitrc
          echo "browser-linux" | sudo tee rootfs/etc/hostname
          # Empty password field so getty on ttyS0 drops straight into root.
          sudo sed -i 's|^root:[^:]*|root:|' rootfs/etc/shadow

      - name: Trim the rootfs
        run: |
          sudo rm -rf rootfs/var/lib/apt/lists rootfs/var/cache/apt/archives \
                     rootfs/usr/share/doc rootfs/usr/share/man rootfs/usr/share/locale \
                     rootfs/usr/share/i18n rootfs/lib/modules
          sudo du -sh rootfs

      - name: Pack initrd
        run: |
          # Pack from inside the rootfs: the kernel looks for /init at the top
          # level of the cpio, so a "rootfs/" prefix would hide it.
          sudo sh -c 'cd rootfs && find . -depth -print0 | cpio --null -o -H newc 2>/dev/null | gzip -9' > debian-initrd
          ls -l debian-initrd
          sudo sh -c 'gzip -dc debian-initrd | cpio -t 2>/dev/null' | grep -cE '^\./init$' | grep -q '^[1-9]' || { echo "init missing from archive"; exit 1; }

      - name: Stage kernel
        run: |
          cp kernel-out/bzImage debian-bzImage
          ls -l debian-bzImage

      - uses: actions/upload-artifact@v4
        with:
          name: debian-i386
          path: |
            debian-bzImage
            debian-initrd

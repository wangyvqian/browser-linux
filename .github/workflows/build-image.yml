name: build-image

# Two guests from one recipe:
#   terminal — Debian i386 minbase packed as an initrd, small enough to boot
#              straight from the network on every visit.
#   desktop  — the same rootfs plus X, written into a real ext4 disk image and
#              split into 128KB zstd chunks, because a 300MB desktop does not
#              belong in memory and the disk is what makes it persistable.
# v86 has no long mode, so everything here is 32-bit.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-image.yml"
      - "image/**"

permissions:
  contents: write

env:
  SUITE: bookworm
  MIRROR: http://deb.debian.org/debian
  DESKTOP_PACKAGES: >-
    xserver-xorg xserver-xorg-video-fbdev xserver-xorg-input-evdev
    x11-xserver-utils xterm openbox lxpanel pcmanfm
    yaru-theme-gtk yaru-theme-icon fonts-dejavu-core fontconfig

jobs:
  kernel:
    uses: ./.github/workflows/build-kernel.yml

  terminal:
    needs: kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap cpio

      - name: Fetch custom kernel
        uses: actions/download-artifact@v4
        with:
          name: kernel-i386
          path: kernel-out

      - name: Bootstrap rootfs
        run: |
          sudo debootstrap --arch=i386 --variant=minbase \
            --include=sysvinit-core,sysvinit-utils,netbase,iproute2,procps,less,vim-tiny \
            --exclude=systemd,systemd-sysv \
            "$SUITE" rootfs "$MIRROR"
          sudo cp image/init rootfs/init
          sudo chmod 755 rootfs/init
          sudo cp image/fstab rootfs/etc/fstab
          sudo cp image/inittab rootfs/etc/inittab
          echo browser-linux | sudo tee rootfs/etc/hostname
          sudo sed -i 's|^root:[^:]*|root:|' rootfs/etc/shadow
          sudo rm -rf rootfs/var/lib/apt/lists rootfs/var/cache/apt/archives \
                      rootfs/usr/share/doc rootfs/usr/share/man \
                      rootfs/usr/share/locale rootfs/usr/share/i18n rootfs/lib/modules

      - name: Pack initrd
        run: |
          # Pack from inside the rootfs: the kernel looks for /init at the top
          # level of the cpio, so a "rootfs/" prefix would hide it.
          sudo sh -c 'cd rootfs && find . -depth -print0 | cpio --null -o -H newc 2>/dev/null | gzip -9' > debian-initrd
          ls -l debian-initrd
          echo '--- top-level entries in the archive ---'
          sudo sh -c 'gzip -dc debian-initrd | cpio -t --quiet 2>/dev/null' | grep -vE '^\./[^/]+/' | head -20
          sudo sh -c 'gzip -dc debian-initrd | cpio -t --quiet 2>/dev/null' | grep -qxE '\./?init'

      - name: Stage kernel
        run: |
          cp kernel-out/bzImage debian-bzImage
          ls -l debian-bzImage

      - uses: actions/upload-artifact@v4
        with:
          name: terminal-i386
          path: |
            debian-bzImage
            debian-initrd

  desktop:
    needs: kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap zstd

      - name: Fetch custom kernel
        uses: actions/download-artifact@v4
        with:
          name: kernel-i386
          path: kernel-out

      - name: Bootstrap rootfs with X
        run: |
          sudo debootstrap --arch=i386 --variant=minbase \
            --include=sysvinit-core,sysvinit-utils,netbase,iproute2,procps,less,vim-tiny \
            --exclude=systemd,systemd-sysv \
            "$SUITE" rootfs "$MIRROR"
          sudo mount --rbind /dev rootfs/dev
          sudo mount -t proc proc rootfs/proc
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf
          sudo chroot rootfs apt-get update
          sudo chroot rootfs env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends $DESKTOP_PACKAGES
          sudo umount -R rootfs/dev rootfs/proc

      - name: Configure the guest
        run: |
          sudo cp image/fstab-desktop rootfs/etc/fstab
          sudo cp image/inittab-desktop rootfs/etc/inittab
          sudo cp image/xsession rootfs/root/.xinitrc
          sudo cp image/profile rootfs/root/.profile
          sudo cp image/xorg.conf rootfs/etc/X11/xorg.conf
          sudo chmod 755 rootfs/root/.xinitrc
          echo browser-linux | sudo tee rootfs/etc/hostname
          sudo sed -i 's|^root:[^:]*|root:|' rootfs/etc/shadow
          sudo rm -rf rootfs/var/lib/apt/lists rootfs/var/cache/apt/archives \
                      rootfs/usr/share/man rootfs/usr/share/locale rootfs/lib/modules
          sudo du -sh rootfs

      - name: Write the disk image
        run: |
          # ext4 on an IDE disk: both are compiled into our kernel, so the guest
          # mounts root straight from the disk with no initrd in the way.
          truncate -s 2G debian-desktop.img
          sudo mkfs.ext4 -q -L browserlinux -d rootfs debian-desktop.img
          sudo tune2fs -O ^has_journal debian-desktop.img
          df --output=used -B1 --total rootfs | tail -1

      - name: Split into static-hosting chunks
        run: |
          curl -fsSL -o split-image.py https://raw.githubusercontent.com/copy/v86/master/tools/split-image.py
          mkdir -p desktop-chunks
          python3 split-image.py --zstd 128k debian-desktop.img desktop-chunks/chunk-%d-%d
          ls desktop-chunks | wc -l
          du -sh desktop-chunks

      - name: Stage kernel
        run: cp kernel-out/bzImage debian-bzImage

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-i386
          path: |
            debian-bzImage
            desktop-chunks

  # The guests are assembled into the site here rather than committed to git:
  # Pages serves them same-origin, and the repo stays free of binaries.
  site:
    needs: [terminal, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Fetch BIOS and the demo image
        run: npm run assets

      - name: Collect guest images
        uses: actions/download-artifact@v4
        with:
          pattern: "{terminal-i386,desktop-i386}"
          path: public/images
          merge-multiple: true

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4

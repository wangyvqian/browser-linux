name: build-kernel

# Builds a 32-bit x86 kernel with everything v86 needs built in, so the guest
# never has to load modules and the image can drop /lib/modules entirely.

on:
  workflow_dispatch:
  # Kicked off by build-image; no push trigger, so a kernel change does not
  # build twice.
  workflow_call:

permissions:
  contents: read

env:
  KERNEL_VERSION: 6.6

jobs:
  i386:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A full kernel build is ~10 minutes; the image jobs would rebuild it on
      # every tweak to the rootfs recipe without this.
      - name: Restore cached kernel
        id: cache
        uses: actions/cache@v4
        with:
          path: cache
          key: bzImage-${{ env.KERNEL_VERSION }}-${{ hashFiles('kernel/config.sh') }}

      - if: steps.cache.outputs.cache-hit != 'true'
        name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libssl-dev libelf-dev bc cpio xz-utils

      - if: steps.cache.outputs.cache-hit != 'true'
        name: Fetch kernel source
        run: |
          curl -fsSL "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz" \
            | tar -xJ
          mv "linux-${KERNEL_VERSION}" linux

      - if: steps.cache.outputs.cache-hit != 'true'
        name: Configure
        working-directory: linux
        run: |
          make ARCH=x86 i386_defconfig
          sh ../kernel/config.sh
          make ARCH=x86 olddefconfig
          grep -E '^CONFIG_X86_32=|^CONFIG_X86_PAE|^CONFIG_MODULES|^CONFIG_RELOCATABLE' .config || true

      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build
        working-directory: linux
        run: |
          make ARCH=x86 -j"$(nproc)" bzImage
          mkdir -p ../cache
          cp arch/x86/boot/bzImage ../cache/bzImage

      - name: Report size
        run: ls -l cache/bzImage

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-i386
          path: cache/bzImage

name: build-kernel

# Builds a 32-bit x86 kernel with everything v86 needs built in, so the guest
# never has to load modules and the image can drop /lib/modules entirely.

on:
  workflow_dispatch:
  # Kicked off by build-image; no push trigger, so a kernel change does not
  # build twice.
  workflow_call:

permissions:
  contents: read

env:
  KERNEL_VERSION: 6.6

jobs:
  i386:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libssl-dev libelf-dev bc cpio xz-utils

      - name: Fetch kernel source
        run: |
          curl -fsSL "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz" \
            | tar -xJ
          mv "linux-${KERNEL_VERSION}" linux

      - name: Configure
        working-directory: linux
        run: |
          make ARCH=x86 i386_defconfig
          sh ../kernel/config.sh
          make ARCH=x86 olddefconfig
          grep -E '^CONFIG_X86_32=|^CONFIG_X86_PAE|^CONFIG_MODULES' .config || true

      - name: Build
        working-directory: linux
        run: make ARCH=x86 -j"$(nproc)" bzImage

      - name: Report size
        run: ls -l linux/arch/x86/boot/bzImage

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-i386
          path: linux/arch/x86/boot/bzImage

# Minimal X setup for an emulated, GPU-less guest: fbdev for the display,
# evdev for the PS/2 keyboard and mouse v86 exposes. No compositor — at
# single-digit MIPS a compositor costs more than the applications do.
Section "Device"
    Identifier  "v86-fb"
    Driver      "fbdev"
    Option      "fbdev" "/dev/fb0"
    Option      "WriteCombined" "false"
EndSection

Section "Monitor"
    Identifier  "v86-monitor"
    HorizSync   30-70
    VertRefresh 50-100
    Modeline    "800x600" 40.0 800 840 968 1056 600 601 605 628 +hsync +vsync
EndSection

Section "Screen"
    Identifier  "v86-screen"
    Device      "v86-fb"
    Monitor     "v86-monitor"
    DefaultDepth 16
    SubSection "Display"
        Depth   16
        Modes   "800x600"
    EndSubSection
EndSection

Section "ServerFlags"
    Option      "DontVTSwitch" "true"
    Option      "DontZap"       "true"
EndSection

Section "InputDevice"
    Identifier  "v86-kbd"
    Driver      "evdev"
    Option      "Device" "/dev/input/event0"
    Option      "CoreKeyboard"
EndSection

Section "InputDevice"
    Identifier  "v86-mouse"
    Driver      "evdev"
    Option      "Device" "/dev/input/mice"
    Option      "CorePointer"
EndSection

Section "ServerLayout"
    Identifier  "v86-layout"
    Screen      "v86-screen"
    InputDevice "v86-kbd"   "CoreKeyboard"
    InputDevice "v86-mouse" "CorePointer"
EndSection
